name: ci

# Format, lints, tests in debug and release, and the WebAssembly build of engine/wasm.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Tests in release (integer overflow wraps)
        run: cargo test --workspace --release --locked
      - name: WebAssembly build
        run: cargo build --profile wasm --locked -p engine-wasm --target wasm32-unknown-unknown
