[workspace]
resolver = "3"
members = ["engine/core", "engine/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
engine-core = { path = "engine/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.test]
opt-level = 2

# The engine for the browser (engine/wasm): small, without debug information.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
debug = false
strip = true
panic = "abort"
